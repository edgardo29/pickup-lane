[pytest]
testpaths = backend/tests
addopts =
    --strict-markers
    # backend/tests/platform is archived until the production launch passes.
    --ignore=backend/tests/platform
    --strict-config
    --allow-hosts=127.0.0.1,::1
markers =
    page(page_id, *scenarios): links a test to its page specification ID and Section 5 scenario numbers
    live: calls a real outside service; skipped unless pytest runs with --live
