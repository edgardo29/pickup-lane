target-version = "py312"
# The archived test suite is reference only and does not run.
extend-exclude = ["backend/tests_archive"]

[lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[lint.per-file-ignores]
# Package __init__ files re-export names on purpose.
"__init__.py" = ["F401"]
