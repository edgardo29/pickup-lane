[tool:pytest]
addopts = --strict-markers
norecursedirs =
    legacy
markers =
    no_db_cleanup: marks backend harness tests that must not open or clean the application database
    migration_lifecycle: marks migration tests that own the dedicated migration test database instead of the ordinary application test database
    requirement(*ids): maps a pytest test to one or more stable production-readiness requirement IDs
    suite_type(name): declares an explicit execution-suite type when a future suite needs to override the owning directory default

[mutmut]
test_time_multiplier = 10
test_time_base = 5
